annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate random-effects meta-analytic pooled effect size and heterogeneity
  (I-squared).
input_schema:
  additionalProperties: false
  properties:
    effect_sizes:
      type: string
    sample_sizes:
      type: string
  required:
  - effect_sizes
  - sample_sizes
  type: object
name: compute-pooled-effect-size
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
