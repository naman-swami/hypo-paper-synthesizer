annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Extract formal scientific hypotheses, sample sizes, and p-values from
  academic paper text.
input_schema:
  additionalProperties: false
  properties:
    abstract_text:
      type: string
    doi:
      type: string
  required:
  - abstract_text
  type: object
name: extract-methodology-claims
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
