annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Score research methodology on statistical power, pre-registration status,
  and data availability.
input_schema:
  additionalProperties: false
  properties:
    methodology_description:
      type: string
    statistical_power:
      type: number
  required:
  - methodology_description
  type: object
name: audit-replicability-risk
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
